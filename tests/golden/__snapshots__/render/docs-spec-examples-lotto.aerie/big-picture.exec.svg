<?xml-stylesheet href="../signal.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="aerie" viewBox="0 0 760 816" width="760" height="816" overflow="visible" role="img" aria-label="The Lotto suite: Big picture" data-view="big-picture" data-audience="exec">
  <defs>
    <pattern id="aerie-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="hatch-bg" width="7" height="7"/>
      <path class="hatch-line" d="M0 0V7"/>
    </pattern>
    <radialGradient id="aerie-dawn" cx="0.18" cy="0" r="1.05" fx="0.12" fy="0">
      <stop class="dawn-0" offset="0"/>
      <stop class="dawn-1" offset="0.55"/>
      <stop class="dawn-2" offset="1"/>
    </radialGradient>
  </defs>
  <g class="boxes">
    <g class="node leaf person" data-id="user" transform="translate(180 29)">
      <rect class="shape" width="178" height="59" rx="29.5"/>
      <rect class="ring" x="-3" y="-3" width="184" height="65" rx="32.5"/>
      <rect class="icon-tile" x="7" y="7" width="32" height="32" rx="8"/>
      <g class="icon" data-icon="person" transform="translate(12 12) scale(0.34375)">
        <circle cx="32" cy="21" r="10"/>
        <path d="M12 56c0-12 9-20 20-20s20 8 20 20"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="32">User</text>
      <text class="t-tagline" x="44" y="44" data-width="105">Using a browser</text>
    </g>
    <g class="node open depth-0" data-id="suite" transform="translate(12 191)">
      <rect class="shape" width="426.5" height="598" rx="14"/>
      <rect class="dawn" width="426.5" height="598" rx="14"/>
      <rect class="ring" x="-3" y="-3" width="432.5" height="604" rx="17"/>
      <rect class="icon-tile" x="7" y="7" width="32" height="32" rx="8"/>
      <g class="icon" data-icon="stack" transform="translate(12 12) scale(0.34375)">
        <path d="M32 9 56 21 32 33 8 21Z"/>
        <path d="M8 31l24 12 24-12"/>
        <path d="M8 41l24 12 24-12"/>
