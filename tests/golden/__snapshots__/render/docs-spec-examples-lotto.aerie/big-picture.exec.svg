      <path class="arrow" d="M264 249L269 261L274 249"/>
    </g>
    <g class="edge" data-id="website-&gt;screen-api">
      <path class="line" d="M269 320L269 381"/>
      <path class="flow" d="M269 320L269 381"/>
      <path class="arrow" d="M264 369L269 381L274 369"/>
    </g>
    <g class="edge" data-id="screen-api-&gt;engine">
      <path class="line" d="M269 457L269 518"/>
      <path class="flow" d="M269 457L269 518"/>
      <path class="arrow" d="M264 506L269 518L274 506"/>
    </g>
    <g class="edge" data-id="engine-&gt;store">
      <path class="line" d="M269 614L269 675"/>
      <path class="flow" d="M269 614L269 675"/>
      <path class="arrow" d="M264 663L269 675L274 663"/>
    </g>
    <g class="edge" data-id="store-&gt;texas">
      <path class="line" d="M269 771L269 795Q269 804 278 804L505 804Q514 804 514 795L514 88"/>
      <path class="flow" d="M269 771L269 795Q269 804 278 804L505 804Q514 804 514 795L514 88"/>
      <path class="arrow" d="M519 100L514 88L509 100"/>
    </g>
  </g>
  <g class="heads">
    <g class="head depth-0" data-id="suite" transform="translate(12 191)">
      <text class="t-name" x="44" y="26" data-width="72">Lotto suite</text>
      <text class="t-tagline" x="44" y="44" data-width="172">Our lottery number service</text>
    </g>
  </g>
  <g class="labels">
    <g class="label" data-id="user-&gt;website">
      <title>User uses Website.</title>
      <rect class="pill" x="221" y="126.5" width="45" height="21" rx="10"/>
      <text class="t-label" x="228" y="142.5" data-width="31">uses</text>
    </g>
    <g class="label" data-id="website-&gt;screen-api">
      <title>Website works through Website back end.</title>
      <rect class="pill" x="137" y="340" width="108" height="21" rx="10"/>
      <text class="t-label" x="144" y="356" data-width="94">works through</text>
    </g>
    <g class="label" data-id="screen-api-&gt;engine">
      <title>Website back end asks for numbers from Request handling.</title>
      <rect class="pill" x="72" y="477" width="161" height="21" rx="10"/>
      <text class="t-label" x="79" y="493" data-width="147">asks for numbers from</text>
    </g>
    <g class="label" data-id="engine-&gt;store">
      <title>Draw history lookup fetches draw history from Draw history service.</title>
      <rect class="pill" x="58" y="634" width="181" height="21" rx="10"/>
      <text class="t-label" x="65" y="650" data-width="167">fetches draw history from</text>
    </g>
    <g class="label" data-id="store-&gt;texas">
      <title>Results updater downloads new results from Texas Lottery website.</title>
      <rect class="pill" x="535" y="126.5" width="197" height="21" rx="10"/>
      <text class="t-label" x="542" y="142.5" data-width="183">downloads new results from</text>
    </g>
  </g>
