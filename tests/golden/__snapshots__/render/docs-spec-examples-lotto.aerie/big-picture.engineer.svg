      <text class="t-tagline-code" x="44" y="44" data-width="203">lotto-options-core-server</text>
      <text class="t-tagline-code" x="44" y="61" data-width="41">:8002</text>
      <text class="t-chip" x="44" y="79" data-width="80">4 parts inside</text>
