      <text class="t-tagline-code" x="44" y="61" data-width="65">per game</text>
    </g>
  </g>
  <g class="edges">
    <g class="edge" data-id="user-&gt;website">
      <path class="line" d="M269 88L269 261"/>
      <path class="arrow" d="M264 249L269 261L274 249"/>
    </g>
    <g class="edge" data-id="website-&gt;screen-api">
      <path class="line" d="M269 320L269 381"/>
      <path class="arrow" d="M264 369L269 381L274 369"/>
    </g>
    <g class="edge" data-id="screen-api-&gt;engine">
      <path class="line" d="M269 457L269 518"/>
      <path class="arrow" d="M264 506L269 518L274 506"/>
    </g>
    <g class="edge" data-id="engine-&gt;store">
      <path class="line" d="M269 614L269 675"/>
      <path class="arrow" d="M264 663L269 675L274 663"/>
    </g>
    <g class="edge" data-id="store-&gt;texas">
      <path class="line" d="M269 771L269 795Q269 804 278 804L506 804Q515 804 515 795L515 88"/>
      <path class="arrow" d="M520 100L515 88L510 100"/>
    </g>
  </g>
  <g class="heads">
    <g class="head depth-0" data-id="suite" transform="translate(12 191)">
      <text class="t-name" x="44" y="26" data-width="65">Lotto suite</text>
      <text class="t-tagline-code" x="44" y="44" data-width="195">Runs as one stack on one</text>
      <text class="t-tagline-code" x="44" y="61" data-width="57">machine</text>
    </g>
  </g>
  <g class="labels">
    <g class="label" data-id="user-&gt;website">
      <title>User uses Website.</title>
      <text class="t-label-code" x="227" y="142.5" data-width="33">uses</text>
    </g>
    <g class="label" data-id="website-&gt;screen-api">
      <title>Website calls /ui/* on Screen API.</title>
      <text class="t-label-code" x="142.5" y="356" data-width="114">calls /ui/* on</text>
    </g>
    <g class="label" data-id="screen-api-&gt;engine">
      <title>Screen API POSTs /api/v1/analysis/* to Request handling.</title>
      <text class="t-label-code" x="43" y="493" data-width="219">POSTs /api/v1/analysis/* to</text>
    </g>
    <g class="label" data-id="engine-&gt;store">
      <title>Draw history lookup POSTs /api/v1/state/games to Draw history service.</title>
      <text class="t-label-code" x="35" y="650" data-width="227">POSTs /api/v1/state/games to</text>
    </g>
    <g class="label" data-id="store-&gt;texas">
      <title>Results updater polls CSV exports every 2 h from Texas Lottery website.</title>
      <text class="t-label-code" x="525" y="134" data-width="219">polls CSV exports every 2 h</text>
      <text class="t-label-code" x="618" y="151" data-width="33">from</text>
    </g>
  </g>
</svg>
