<?xml-stylesheet href="../contour.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="aerie" viewBox="0 0 761 816" width="761" height="816" overflow="visible" role="img" aria-label="The Lotto suite: Big picture" data-view="big-picture" data-audience="engineer">
  <defs>
    <pattern id="aerie-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="hatch-bg" width="7" height="7"/>
      <path class="hatch-line" d="M0 0V7"/>
    </pattern>
  </defs>
  <g class="boxes">
    <g class="node leaf person" data-id="user" transform="translate(180 29)">
      <rect class="shape" width="178" height="59" rx="29.5"/>
      <rect class="ring" x="-3" y="-3" width="184" height="65" rx="32.5"/>
      <g class="icon" data-icon="person" transform="translate(12 12) scale(0.34375)">
        <circle cx="32" cy="21" r="10"/>
        <path d="M12 56c0-12 9-20 20-20s20 8 20 20"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="28">User</text>
      <text class="t-tagline-code" x="44" y="44" data-width="122">Using a browser</text>
    </g>
    <g class="node open depth-0" data-id="suite" transform="translate(12 191)">
      <rect class="shape" width="426.5" height="598" rx="18"/>
      <rect class="inner" x="5" y="5" width="416.5" height="588" rx="13"/>
      <rect class="ring" x="-3" y="-3" width="432.5" height="604" rx="21"/>
      <g class="icon" data-icon="stack" transform="translate(12 12) scale(0.34375)">
        <path d="M32 9 56 21 32 33 8 21Z"/>
        <path d="M8 31l24 12 24-12"/>
        <path d="M8 41l24 12 24-12"/>
      </g>
      <g class="control" transform="translate(405.5 21)">
        <circle r="9"/>
        <path d="M-4 0H4"/>
      </g>
    </g>
    <g class="node leaf" data-id="website" transform="translate(127.5 261)">
      <rect class="shape" width="283" height="59" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="289" height="65" rx="7"/>
      <g class="icon" data-icon="web" transform="translate(12 12) scale(0.34375)">
        <rect x="8" y="11" width="48" height="42" rx="5"/>
        <path d="M8 21h48"/>
        <path d="M27 29l-7 7 7 7"/>
        <path d="M37 29l7 7-7 7"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="49">Website</text>
      <text class="t-tagline-code" x="44" y="44" data-width="227">lotto-options-ui, Angular 21</text>
    </g>
    <g class="node leaf" data-id="screen-api" transform="translate(146 381)">
      <rect class="shape" width="246" height="76" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="252" height="82" rx="7"/>
      <g class="icon" data-icon="api" transform="translate(12 12) scale(0.34375)">
        <rect x="26" y="18" width="14" height="28" rx="3"/>
        <path d="M7 25h19M7 39h19"/>
        <path d="M40 32h16"/>
        <path d="M50 26l6 6-6 6"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="65">Screen API</text>
      <text class="t-tagline-code" x="44" y="44" data-width="187">lotto-options-core-bff,</text>
      <text class="t-tagline-code" x="44" y="61" data-width="106">WebFlux :8080</text>
    </g>
    <g class="node closed" data-id="engine" transform="translate(123.5 518)">
      <rect class="shape" width="291" height="96" rx="8"/>
      <rect class="inner" x="5" y="5" width="281" height="86" rx="3"/>
      <rect class="ring" x="-3" y="-3" width="297" height="102" rx="11"/>
