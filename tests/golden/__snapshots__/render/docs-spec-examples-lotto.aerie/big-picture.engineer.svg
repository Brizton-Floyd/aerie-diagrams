        <circle r="9"/>
        <path d="M-4 0H4M0-4V4"/>
      </g>
    </g>
    <g class="node closed" data-id="store" transform="translate(117.5 675)">
      <rect class="shape" width="303" height="96" rx="8"/>
      <rect class="inner" x="5" y="5" width="293" height="86" rx="3"/>
      <rect class="ring" x="-3" y="-3" width="309" height="102" rx="11"/>
      <g class="icon" data-icon="cylinder" transform="translate(12 12) scale(0.34375)">
        <path d="M14 14c0-3.3 8-6 18-6s18 2.7 18 6-8 6-18 6-18-2.7-18-6Z"/>
        <path d="M14 14v36c0 3.3 8 6 18 6s18-2.7 18-6V14"/>
        <path d="M14 26c0 3.3 8 6 18 6s18-2.7 18-6"/>
        <path d="M14 38c0 3.3 8 6 18 6s18-2.7 18-6"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="78">Results store</text>
      <text class="t-tagline-code" x="44" y="44" data-width="219">lottery-result-persistence-</text>
      <text class="t-tagline-code" x="44" y="61" data-width="106">service :8001</text>
      <text class="t-chip" x="44" y="79" data-width="80">4 parts inside</text>
      <g class="control" transform="translate(282 21)">
        <circle r="9"/>
        <path d="M-4 0H4M0-4V4"/>
      </g>
    </g>
    <g class="node leaf external" data-id="texas" transform="translate(384 12)">
      <rect class="shape" width="262" height="76" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="268" height="82" rx="7"/>
      <g class="icon" data-icon="building" transform="translate(12 12) scale(0.34375)">
        <path d="M8 56h48"/>
        <path d="M16 56V10h32v46"/>
        <path d="M24 18h4M36 18h4M24 27h4M36 27h4M24 36h4M36 36h4"/>
        <path d="M29 56V46h6v10"/>
