      <rect class="shape" width="383" height="449" rx="18"/>
      <rect class="inner" x="5" y="5" width="373" height="439" rx="13"/>
      <rect class="ring" x="-3" y="-3" width="389" height="455" rx="21"/>
      <g class="icon" data-icon="stack" transform="translate(12 12) scale(0.34375)">
