<?xml-stylesheet href="../contour.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="aerie" viewBox="0 0 670 795" width="670" height="795" overflow="visible" role="img" aria-label="Every Contour shape: Shapes" data-view="shapes" data-audience="manager">
  <defs>
    <pattern id="aerie-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
