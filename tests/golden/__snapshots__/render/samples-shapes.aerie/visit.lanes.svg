<?xml-stylesheet href="../contour.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="aerie" viewBox="0 0 967 432" width="967" height="432" overflow="visible" role="img" aria-label="Every Contour shape: A visit, as lanes" data-view="shapes" data-audience="manager" data-scenario="visit">
  <defs>
    <pattern id="aerie-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="hatch-bg" width="7" height="7"/>
      <path class="hatch-line" d="M0 0V7"/>
    </pattern>
  </defs>
  <g class="rows">
    <rect class="row now" data-step="5" x="0" y="379" width="967" height="37"/>
  </g>
  <g class="bands">
    <g class="band open depth-0" data-id="ground">
      <rect class="shape" x="0" y="0" width="423" height="28" rx="9"/>
      <text class="t-band" x="10" y="19" data-width="44">Ground</text>
    </g>
    <g class="band open depth-1" data-id="ridge">
      <rect class="shape" x="0" y="28" width="423" height="28" rx="9"/>
      <text class="t-band" x="10" y="47" data-width="34">Ridge</text>
    </g>
    <g class="band open depth-2" data-id="crest">
      <rect class="shape" x="0" y="56" width="423" height="28" rx="9"/>
      <text class="t-band" x="10" y="75" data-width="31">Crest</text>
    </g>
    <g class="band open depth-3" data-id="summit">
      <rect class="shape" x="0" y="84" width="423" height="28" rx="9"/>
      <text class="t-band" x="10" y="103" data-width="47">Summit</text>
    </g>
    <g class="band open depth-3" data-id="peak">
      <rect class="shape" x="0" y="112" width="423" height="28" rx="9"/>
      <text class="t-band" x="10" y="131" data-width="29">Peak</text>
    </g>
  </g>
  <g class="lanes">
    <path class="lane-line" data-id="shed" d="M101 215V432"/>
    <path class="lane-line" data-id="cairn" d="M328.5 215V432"/>
    <path class="lane-line" data-id="visitor" d="M562.5 215V432"/>
    <path class="lane-line" data-id="outside" d="M834.5 215V432"/>
  </g>
  <g class="boxes">
    <g class="node leaf now" data-id="shed" transform="translate(0 156)">
      <rect class="shape" width="202" height="59" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="208" height="65" rx="7"/>
      <g class="icon" data-icon="stack" transform="translate(12 12) scale(0.34375)">
        <path d="M32 9 56 21 32 33 8 21Z"/>
        <path d="M8 31l24 12 24-12"/>
        <path d="M8 41l24 12 24-12"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="31">Shed</text>
      <text class="t-tagline" x="44" y="44" data-width="120">A closed container</text>
    </g>
    <g class="node leaf" data-id="cairn" transform="translate(234 156)">
      <rect class="shape" width="189" height="59" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="195" height="65" rx="7"/>
      <g class="icon" data-icon="box" transform="translate(12 12) scale(0.34375)">
        <rect x="12" y="12" width="40" height="40" rx="8"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="33">Cairn</text>
      <text class="t-tagline" x="44" y="44" data-width="133">A leaf at the very top</text>
    </g>
    <g class="node leaf person" data-id="visitor" transform="translate(455 156)">
      <rect class="shape" width="215" height="59" rx="29.5"/>
      <rect class="ring" x="-3" y="-3" width="221" height="65" rx="32.5"/>
      <g class="icon" data-icon="person" transform="translate(12 12) scale(0.34375)">
        <circle cx="32" cy="21" r="10"/>
        <path d="M12 56c0-12 9-20 20-20s20 8 20 20"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="39">Visitor</text>
      <text class="t-tagline" x="44" y="44" data-width="159">A person, drawn as a pill</text>
    </g>
    <g class="node leaf external" data-id="outside" transform="translate(702 156)">
      <rect class="shape" width="265" height="59" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="271" height="65" rx="7"/>
      <g class="icon" data-icon="building" transform="translate(12 12) scale(0.34375)">
        <path d="M8 56h48"/>
        <path d="M16 56V10h32v46"/>
        <path d="M24 18h4M36 18h4M24 27h4M36 27h4M24 36h4M36 36h4"/>
        <path d="M29 56V46h6v10"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="93">Outside service</text>
      <text class="t-tagline" x="44" y="44" data-width="209">Hatched, off the edge of the map</text>
    </g>
  </g>
  <g class="trail">
    <g class="step call past" data-step="1">
      <path class="curve" d="M562.5 264L328.5 264"/>
      <path class="arrow" d="M340.5 259L328.5 264L340.5 269"/>
    </g>
    <g class="step call past" data-step="2">
      <path class="curve" d="M328.5 301L834.5 301"/>
      <path class="arrow" d="M822.5 306L834.5 301L822.5 296"/>
    </g>
    <g class="step reply past" data-step="3">
      <path class="curve" d="M834.5 338L328.5 338"/>
    </g>
    <g class="step call past" data-step="4">
      <path class="curve" d="M328.5 375L101 375"/>
      <path class="arrow" d="M113 370L101 375L113 380"/>
    </g>
    <g class="step call now" data-step="5">
      <path class="curve" d="M101 383L119 383Q125 383 125 389L125 406Q125 412 119 412L101 412" pathLength="1"/>
      <path class="arrow" d="M113 407L101 412L113 417"/>
    </g>
  </g>
  <g class="labels">
    <g class="label" data-step="1">
      <text class="t-label" x="411.5" y="251" data-width="68">walks up to</text>
    </g>
    <g class="label" data-step="2">
      <text class="t-label" x="559" y="288" data-width="45">calls on</text>
    </g>
    <g class="label" data-step="3">
      <text class="t-label" x="557" y="325" data-width="49">answers</text>
    </g>
    <g class="label" data-step="4">
      <text class="t-label" x="175.75" y="362" data-width="78">keeps tools in</text>
    </g>
    <g class="label" data-step="5">
      <text class="t-label" x="142" y="403" data-width="49">leans on</text>
    </g>
  </g>
  <g class="badges">
    <g class="badge" data-step="1" transform="translate(562.5 264)">
      <circle r="9"/>
      <text class="t-badge" y="4">1</text>
    </g>
    <g class="badge" data-step="2" transform="translate(328.5 301)">
      <circle r="9"/>
      <text class="t-badge" y="4">2</text>
    </g>
    <g class="badge" data-step="3" transform="translate(834.5 338)">
      <circle r="9"/>
      <text class="t-badge" y="4">3</text>
    </g>
    <g class="badge" data-step="4" transform="translate(328.5 375)">
      <circle r="9"/>
      <text class="t-badge" y="4">4</text>
    </g>
    <g class="badge now" data-step="5" transform="translate(101 383)">
      <circle r="12"/>
      <text class="t-badge" y="4.5">5</text>
    </g>
  </g>
</svg>
