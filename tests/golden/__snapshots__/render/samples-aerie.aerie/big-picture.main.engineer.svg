<?xml-stylesheet href="../signal.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="aerie" viewBox="0 0 719 628" width="719" height="628" overflow="visible" role="img" aria-label="How Aerie works: Big picture" data-view="big-picture" data-audience="engineer">
  <defs>
