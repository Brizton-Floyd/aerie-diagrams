      <path class="line" d="M277 583L277 607Q277 616 286 616L521 616Q530 616 530 607L530 71"/>
      <path class="flow" d="M277 583L277 607Q277 616 286 616L521 616Q530 616 530 607L530 71"/>
      <path class="arrow" d="M535 83L530 71L525 83"/>
    </g>
