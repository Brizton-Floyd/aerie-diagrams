      <text class="t-label-code" x="144" y="462" data-width="17">to</text>
    </g>
    <g class="label" data-id="picture-&gt;reader">
      <title>Browser viewer shows the diagram to Diagram reader.</title>
      <rect class="pill" x="533" y="101" width="176" height="21" rx="10"/>
      <text class="t-label-code" x="540" y="117" data-width="162">shows the diagram to</text>
    </g>
