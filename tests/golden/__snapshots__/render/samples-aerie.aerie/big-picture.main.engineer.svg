      <text class="t-badge" y="4.5">1</text>
    </g>
    <g class="badge overview-step" data-step="2" role="button" tabindex="0" aria-label="Stage 2: Parse and resolve the model" transform="translate(295 299.5)">
      <circle r="9"/>
