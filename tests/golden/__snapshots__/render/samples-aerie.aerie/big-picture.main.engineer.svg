      <text class="t-tagline-code" x="44" y="44" data-width="203">One model, every audience</text>
    </g>
  </g>
  <g class="labels">
    <g class="label" data-id="author-&gt;editor">
      <title>Model author writes the model in Live editor.</title>
      <rect class="pill" x="107" y="101" width="168" height="21" rx="10"/>
      <text class="t-label-code" x="114" y="117" data-width="154">writes the model in</text>
    </g>
    <g class="label" data-id="editor-&gt;meaning">
      <title>Live editor sends model text to Model semantics.</title>
      <rect class="pill" x="109" y="289" width="168" height="21" rx="10"/>
      <text class="t-label-code" x="116" y="305" data-width="154">sends model text to</text>
    </g>
    <g class="label" data-id="meaning-&gt;picture">
      <title>Model semantics supplies the resolved picture to Layout engine.</title>
      <rect class="pill" x="28" y="429" width="249" height="38" rx="10"/>
