<?xml-stylesheet href="../signal.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="aerie" viewBox="0 0 566 408" width="566" height="408" overflow="visible" role="img" aria-label="The Lotto suite: Results poll, as lanes" data-view="big-picture" data-audience="manager" data-scenario="results-poll">
  <defs>
    <pattern id="aerie-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="hatch-bg" width="7" height="7"/>
      <path class="hatch-line" d="M0 0V7"/>
    </pattern>
    <radialGradient id="aerie-dawn" cx="0.18" cy="0" r="1.05" fx="0.12" fy="0">
      <stop class="dawn-0" offset="0"/>
      <stop class="dawn-1" offset="0.55"/>
      <stop class="dawn-2" offset="1"/>
    </radialGradient>
  </defs>
  <g class="rows">
    <rect class="row now" data-step="6" x="0" y="338" width="566" height="54"/>
  </g>
  <g class="bands">
    <g class="band open depth-0" data-id="suite">
      <rect class="shape" x="0" y="0" width="275" height="28" rx="9"/>
      <text class="t-band" x="10" y="19" data-width="69">Lotto suite</text>
    </g>
  </g>
  <g class="lanes">
    <path class="lane-line" data-id="store" d="M137.5 120V408"/>
    <path class="lane-line" data-id="texas" d="M436.5 120V408"/>
  </g>
  <g class="boxes">
    <g class="node leaf now" data-id="store" transform="translate(0 44)">
      <rect class="shape" width="275" height="76" rx="8"/>
      <rect class="ring" x="-3" y="-3" width="281" height="82" rx="11"/>
      <rect class="icon-tile" x="7" y="7" width="32" height="32" rx="8"/>
      <g class="icon" data-icon="cylinder" transform="translate(12 12) scale(0.34375)">
        <path d="M14 14c0-3.3 8-6 18-6s18 2.7 18 6-8 6-18 6-18-2.7-18-6Z"/>
        <path d="M14 14v36c0 3.3 8 6 18 6s18-2.7 18-6V14"/>
        <path d="M14 26c0 3.3 8 6 18 6s18-2.7 18-6"/>
        <path d="M14 38c0 3.3 8 6 18 6s18-2.7 18-6"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="89">Results store</text>
      <text class="t-tagline" x="44" y="44" data-width="200">Keeps each game's past draws</text>
    </g>
    <g class="node leaf external" data-id="texas" transform="translate(307 44)">
      <rect class="shape" width="259" height="76" rx="8"/>
      <rect class="ring" x="-3" y="-3" width="265" height="82" rx="11"/>
      <rect class="icon-tile" x="7" y="7" width="32" height="32" rx="8"/>
      <g class="icon" data-icon="building" transform="translate(12 12) scale(0.34375)">
        <path d="M8 56h48"/>
        <path d="M16 56V10h32v46"/>
        <path d="M24 18h4M36 18h4M24 27h4M36 27h4M24 36h4M36 36h4"/>
        <path d="M29 56V46h6v10"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="151">Texas Lottery website</text>
      <text class="t-tagline" x="44" y="44" data-width="201">Publishes winning numbers per</text>
      <text class="t-tagline" x="44" y="61" data-width="36">game</text>
    </g>
  </g>
  <g class="trail">
    <g class="step call past" data-step="1">
      <path class="curve" d="M137.5 140L155.5 140Q161.5 140 161.5 146L161.5 163Q161.5 169 155.5 169L137.5 169"/>
      <path class="arrow" d="M149.5 164L137.5 169L149.5 174"/>
    </g>
    <g class="step call past" data-step="2">
      <path class="curve" d="M137.5 223L436.5 223"/>
      <path class="arrow" d="M424.5 228L436.5 223L424.5 218"/>
    </g>
    <g class="step reply past" data-step="3">
      <path class="curve" d="M436.5 260L137.5 260"/>
    </g>
    <g class="step call past" data-step="4">
      <path class="curve" d="M137.5 268L155.5 268Q161.5 268 161.5 274L161.5 291Q161.5 297 155.5 297L137.5 297"/>
      <path class="arrow" d="M149.5 292L137.5 297L149.5 302"/>
    </g>
    <g class="step reply past" data-step="5">
      <path class="curve" d="M137.5 305L155.5 305Q161.5 305 161.5 311L161.5 328Q161.5 334 155.5 334L137.5 334"/>
    </g>
    <g class="step call now" data-step="6">
      <path class="curve" d="M137.5 342L155.5 342Q161.5 342 161.5 348L161.5 382Q161.5 388 155.5 388L137.5 388" pathLength="1"/>
      <path class="arrow" d="M149.5 383L137.5 388L149.5 393"/>
    </g>
  </g>
  <g class="labels">
    <g class="label" data-step="1">
      <text class="t-label" x="183.5" y="160" data-width="185">has each game refreshed by</text>
    </g>
    <g class="label" data-step="2">
      <text class="t-label" x="187" y="201.5" data-width="200">downloads the results file from</text>
    </g>
    <g class="label" data-step="3">
      <text class="t-label" x="194" y="247" data-width="186">returns the game's results to</text>
    </g>
    <g class="label" data-step="4">
      <text class="t-label" x="193.5" y="288" data-width="173">saves the latest draws into</text>
    </g>
    <g class="label" data-step="5">
      <text class="t-label" x="187" y="325" data-width="194">reports how the game went to</text>
    </g>
    <g class="label" data-step="6">
      <text class="t-label" x="170.5" y="370.5" data-width="218">announces the finished refresh to</text>
    </g>
  </g>
  <g class="badges">
    <g class="badge" data-step="1" transform="translate(137.5 140)">
      <circle r="9"/>
      <text class="t-badge" y="4">1</text>
    </g>
    <g class="badge" data-step="2" transform="translate(137.5 223)">
      <circle r="9"/>
      <text class="t-badge" y="4">2</text>
    </g>
    <g class="badge" data-step="3" transform="translate(436.5 260)">
      <circle r="9"/>
      <text class="t-badge" y="4">3</text>
    </g>
    <g class="badge" data-step="4" transform="translate(137.5 268)">
      <circle r="9"/>
      <text class="t-badge" y="4">4</text>
    </g>
    <g class="badge" data-step="5" transform="translate(137.5 305)">
      <circle r="9"/>
      <text class="t-badge" y="4">5</text>
    </g>
    <g class="badge now" data-step="6" transform="translate(137.5 342)">
      <circle r="12"/>
      <text class="t-badge" y="4.5">6</text>
    </g>
  </g>
</svg>
