<?xml-stylesheet href="../contour.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="aerie" viewBox="0 0 569 374" width="569" height="374" overflow="visible" role="img" aria-label="The Lotto suite: Results poll, as lanes" data-view="big-picture" data-audience="manager" data-scenario="results-poll">
  <defs>
    <pattern id="aerie-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="hatch-bg" width="7" height="7"/>
      <path class="hatch-line" d="M0 0V7"/>
    </pattern>
  </defs>
  <g class="rows">
    <rect class="row now" data-step="6" x="0" y="321" width="569" height="37"/>
  </g>
  <g class="bands">
    <g class="band open depth-0" data-id="suite">
      <rect class="shape" x="0" y="0" width="275" height="28" rx="9"/>
      <text class="t-band" x="10" y="19" data-width="63">Lotto suite</text>
    </g>
  </g>
  <g class="lanes">
    <path class="lane-line" data-id="store" d="M137.5 120V374"/>
    <path class="lane-line" data-id="texas" d="M438 120V374"/>
  </g>
  <g class="boxes">
    <g class="node leaf now" data-id="store" transform="translate(0 44)">
      <rect class="shape" width="275" height="76" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="281" height="82" rx="7"/>
      <g class="icon" data-icon="cylinder" transform="translate(12 12) scale(0.34375)">
        <path d="M14 14c0-3.3 8-6 18-6s18 2.7 18 6-8 6-18 6-18-2.7-18-6Z"/>
        <path d="M14 14v36c0 3.3 8 6 18 6s18-2.7 18-6V14"/>
        <path d="M14 26c0 3.3 8 6 18 6s18-2.7 18-6"/>
        <path d="M14 38c0 3.3 8 6 18 6s18-2.7 18-6"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="78">Results store</text>
      <text class="t-tagline" x="44" y="44" data-width="145">Keeps every past draw</text>
    </g>
    <g class="node leaf external" data-id="texas" transform="translate(307 44)">
      <rect class="shape" width="262" height="76" rx="4"/>
      <rect class="ring" x="-3" y="-3" width="268" height="82" rx="7"/>
      <g class="icon" data-icon="building" transform="translate(12 12) scale(0.34375)">
        <path d="M8 56h48"/>
        <path d="M16 56V10h32v46"/>
        <path d="M24 18h4M36 18h4M24 27h4M36 27h4M24 36h4M36 36h4"/>
        <path d="M29 56V46h6v10"/>
      </g>
      <text class="t-name" x="44" y="26" data-width="132">Texas Lottery website</text>
      <text class="t-tagline" x="44" y="44" data-width="206">Publishes winning numbers per</text>
      <text class="t-tagline" x="44" y="61" data-width="35">game</text>
    </g>
  </g>
  <g class="trail">
    <g class="step call past" data-step="1">
      <path class="curve" d="M137.5 169L438 169"/>
      <path class="arrow" d="M426 174L438 169L426 164"/>
    </g>
    <g class="step reply past" data-step="2">
      <path class="curve" d="M438 206L137.5 206"/>
    </g>
    <g class="step call past" data-step="3">
      <path class="curve" d="M137.5 214L155.5 214Q161.5 214 161.5 220L161.5 237Q161.5 243 155.5 243L137.5 243"/>
      <path class="arrow" d="M149.5 238L137.5 243L149.5 248"/>
    </g>
    <g class="step reply past" data-step="4">
      <path class="curve" d="M137.5 251L155.5 251Q161.5 251 161.5 257L161.5 274Q161.5 280 155.5 280L137.5 280"/>
    </g>
    <g class="step call past" data-step="5">
      <path class="curve" d="M137.5 288L155.5 288Q161.5 288 161.5 294L161.5 311Q161.5 317 155.5 317L137.5 317"/>
      <path class="arrow" d="M149.5 312L137.5 317L149.5 322"/>
    </g>
    <g class="step call now" data-step="6">
      <path class="curve" d="M137.5 325L155.5 325Q161.5 325 161.5 331L161.5 348Q161.5 354 155.5 354L137.5 354" pathLength="1"/>
      <path class="arrow" d="M149.5 349L137.5 354L149.5 359"/>
    </g>
  </g>
  <g class="labels">
    <g class="label" data-step="1">
      <text class="t-label" x="204.25" y="156" data-width="167">downloads new results from</text>
    </g>
    <g class="label" data-step="2">
      <text class="t-label" x="206.75" y="193" data-width="162">returns one file per game to</text>
    </g>
    <g class="label" data-step="3">
      <text class="t-label" x="193.5" y="234" data-width="100">hands the files to</text>
    </g>
    <g class="label" data-step="4">
      <text class="t-label" x="191.5" y="271" data-width="120">returns the draws to</text>
    </g>
    <g class="label" data-step="5">
      <text class="t-label" x="186.5" y="308" data-width="98">saves draws into</text>
    </g>
    <g class="label" data-step="6">
      <text class="t-label" x="187" y="345" data-width="146">announces new draws to</text>
    </g>
  </g>
  <g class="badges">
    <g class="badge" data-step="1" transform="translate(137.5 169)">
      <circle r="9"/>
      <text class="t-badge" y="4">1</text>
    </g>
    <g class="badge" data-step="2" transform="translate(438 206)">
      <circle r="9"/>
      <text class="t-badge" y="4">2</text>
    </g>
    <g class="badge" data-step="3" transform="translate(137.5 214)">
      <circle r="9"/>
      <text class="t-badge" y="4">3</text>
    </g>
    <g class="badge" data-step="4" transform="translate(137.5 251)">
      <circle r="9"/>
      <text class="t-badge" y="4">4</text>
    </g>
    <g class="badge" data-step="5" transform="translate(137.5 288)">
      <circle r="9"/>
      <text class="t-badge" y="4">5</text>
    </g>
    <g class="badge now" data-step="6" transform="translate(137.5 325)">
      <circle r="12"/>
      <text class="t-badge" y="4.5">6</text>
    </g>
  </g>
</svg>
